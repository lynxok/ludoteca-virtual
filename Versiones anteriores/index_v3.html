<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> <!-- THIS FIXES THE BGG IMAGES NOT LOADING -->
    <title>VIRTUAL BOARDGAME STORE</title>
    <!-- Retro Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #0ff;
            --neon-pink: #f0f;
            --neon-yellow: #ff0;
            --bg-color: #050505;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-blue);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 2px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            margin-bottom: 40px;
            background: rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 4em;
            margin: 0;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--neon-blue);
            font-size: 1.5em;
            text-shadow: 0 0 5px var(--neon-blue);
            margin-top: 10px;
        }

        .btn-recommend {
            background-color: transparent;
            color: var(--neon-yellow);
            border: 2px solid var(--neon-yellow);
            padding: 10px 30px;
            font-size: 1.5em;
            font-family: 'VT323', monospace;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            text-shadow: 0 0 5px var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow) inset, 0 0 10px var(--neon-yellow);
            transition: all 0.3s;
        }

        .btn-recommend:hover {
            background-color: var(--neon-yellow);
            color: #000;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .filters input, .filters select {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'VT323', monospace;
            font-size: 1.5em;
            padding: 5px 15px;
            box-shadow: 0 0 5px var(--neon-blue) inset;
        }
        
        .filters input:focus, .filters select:focus {
            outline: none;
            box-shadow: 0 0 15px var(--neon-blue) inset, 0 0 15px var(--neon-blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 40px;
            padding-bottom: 100px;
        }

        /* 3D Shelf Effect */
        .vhs-card {
            background-color: #111;
            border: 2px solid #333;
            height: 300px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            transform-style: preserve-3d;
            box-shadow: 10px 10px 15px rgba(0,0,0,0.8);
        }

        .vhs-card:hover, .vhs-card.selected {
            transform: scale(1.1) translateY(-10px);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), 0 20px 30px rgba(0,0,0,0.9);
            z-index: 100;
        }

        .vhs-card.selected::before {
            content: "▶";
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-yellow);
            font-size: 2em;
            text-shadow: 0 0 10px var(--neon-yellow);
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .vhs-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .vhs-card:hover .vhs-cover, .vhs-card.selected .vhs-cover {
            opacity: 1;
        }

        .vhs-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid var(--neon-pink);
            padding: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            height: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .vhs-card:hover .vhs-info-overlay, .vhs-card.selected .vhs-info-overlay {
            opacity: 1;
        }

        .vhs-title {
            color: var(--neon-yellow);
            font-size: 1.2em;
            margin-bottom: 5px;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .vhs-meta {
            color: #ccc;
            font-size: 0.9em;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #050505;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px var(--neon-blue);
            padding: 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            position: relative;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .modal-close {
            position: absolute;
            top: 10px; right: 20px;
            color: var(--neon-pink);
            font-size: 2em;
            cursor: pointer;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .modal-img-container {
            flex: 1;
        }

        .modal-img-container img {
            width: 100%;
            border: 2px solid #333;
            box-shadow: 10px 10px 0 #111;
        }

        .modal-details {
            flex: 1.5;
            text-align: left;
        }

        .modal-details h2 { 
            color: var(--neon-yellow); 
            font-size: 2.5em; 
            margin-top: 0;
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .modal-details p { 
            font-size: 1.5em; 
            color: #ddd;
            line-height: 1.4;
        }

        .btn-action {
            display: inline-block;
            background-color: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            padding: 10px 20px;
            text-decoration: none;
            font-size: 1.5em;
            margin-top: 20px;
            text-shadow: 0 0 5px var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink) inset;
            transition: 0.3s;
        }

        .btn-action:hover {
            background-color: var(--neon-pink);
            color: #000;
        }

        /* Responsive Modal */
        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

    </style>
</head>

            party: { title: "PARTY GAMES", text: "1. CODENAMES<br>2. THE RESISTANCE<br>3. WAVELENGTH" },
            strategy: { title: "EUROGAMES", text: "1. TERRAFORMING MARS<br>2. SCYTHE<br>3. BRASS: BIRMINGHAM" },
            family: { title: "FAMILY GAMES", text: "1. CASCADIA<br>2. TICKET TO RIDE: EUROPE<br>3. PATCHWORK" },

        let currentSelectedIndex = 0;
        let displayedGames = [];

        function renderGames(games) {
            displayedGames = games;
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            
            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'vhs-card';
                card.id = 'game-card-' + index;
                card.onclick = () => selectGame(index);
                card.ondblclick = () => openGameModal(game);

                card.innerHTML = `
                    <img class="vhs-cover" src="${game.image}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/246x300/011C6B/FFCC00?text=VHS'">
                    <div class="vhs-info-overlay">
                        <div class="vhs-title">${game.name}</div>
                        <div class="vhs-meta">PLAYERS: ${game.players}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            if(games.length > 0) updateSelection(0);
        }

        function filterGames() {
            const searchText = document.getElementById('search').value.toLowerCase();
            const diffFilter = document.getElementById('diff-filter').value;

            const filtered = gamesData.filter(g => {
                const matchName = g.name.toLowerCase().includes(searchText);
                const matchDiff = diffFilter === 'all' || g.difficulty.includes(diffFilter);
                return matchName && matchDiff;
            });
            renderGames(filtered);
        }

        function selectGame(index) {
            const oldCard = document.getElementById('game-card-' + currentSelectedIndex);
            if (oldCard) oldCard.classList.remove('selected');
            
            currentSelectedIndex = index;
            
            const newCard = document.getElementById('game-card-' + currentSelectedIndex);
            if (newCard) {
                newCard.classList.add('selected');
                newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateSelection(index) {
            if(displayedGames.length === 0) return;
            if(index < 0) index = 0;
            if(index >= displayedGames.length) index = displayedGames.length - 1;
            selectGame(index);
        }

        // SEGA Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.id === 'search') return;
            if (document.getElementById('game-modal').style.display === 'flex' || 
                document.getElementById('quiz-modal').style.display === 'flex') {
                if(e.key === 'Escape') {
                    closeModal('game-modal');
                    closeModal('quiz-modal');
                }
                return;
            }

            const gridEl = document.getElementById('games-grid');
            const columns = window.getComputedStyle(gridEl).gridTemplateColumns.split(' ').length;

            if (e.key === 'ArrowRight') { updateSelection(currentSelectedIndex + 1); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { updateSelection(currentSelectedIndex - 1); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { updateSelection(currentSelectedIndex + columns); e.preventDefault(); }
            else if (e.key === 'ArrowUp') { updateSelection(currentSelectedIndex - columns); e.preventDefault(); }
            else if (e.key === 'Enter') {
                if(displayedGames[currentSelectedIndex]) openGameModal(displayedGames[currentSelectedIndex]);
                e.preventDefault();
            }
        });

        function openGameModal(game) {
            document.getElementById('modal-title').innerText = game.name;
            document.getElementById('modal-img').src = game.image;
            document.getElementById('modal-desc').innerHTML = `
                <span style="color:var(--neon-blue)">PLAYERS:</span> ${game.players}<br>
                <span style="color:var(--neon-blue)">DIFF:</span> ${game.difficulty}<br>
                <span style="color:var(--neon-blue)">TYPE:</span> ${game.type}
            `;
            const searchUrl = 'https://www.youtube.com/results?search_query=como+jugar+' + encodeURIComponent(game.name + ' juego de mesa tutorial');
            document.getElementById('modal-link').href = searchUrl;
            document.getElementById('game-modal').style.display = 'flex';
        }

        function openQuizModal() {
            document.getElementById('quiz-title').innerText = "CHOOSE YOUR DESTINY";
            document.getElementById('quiz-body').innerHTML = `
                <button class="btn-recommend" style="border-color:var(--neon-blue); color:var(--neon-blue);" onclick="showRecommendation('party')">1. PARTY: FAST & FUNNY</button>
                <button class="btn-recommend" style="border-color:var(--neon-blue); color:var(--neon-blue);" onclick="showRecommendation('strategy')">2. STRATEGY: BRAIN BURNER</button>
                <button class="btn-recommend" style="border-color:var(--neon-blue); color:var(--neon-blue);" onclick="showRecommendation('family')">3. FAMILY: EASY TO LEARN</button>
                <button class="btn-recommend" style="border-color:var(--neon-blue); color:var(--neon-blue);" onclick="showRecommendation('coop')">4. CO-OP: EPIC ADVENTURE</button>
            `;
            document.getElementById('quiz-modal').style.display = 'flex';
        }

        function showRecommendation(category) {
            const rec = recommendations[category];
            document.getElementById('quiz-title').innerText = rec.title;
            document.getElementById('quiz-body').innerHTML = `
                <p style="color:#ddd;">${rec.text}</p>
                <button class="btn-recommend" style="margin-top:40px;" onclick="openQuizModal()">[ BACK ]</button>
            `;
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Initialize
        renderGames(gamesData);
    </script>
</body>
</html>
