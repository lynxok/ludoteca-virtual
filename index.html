<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reino Medieval - Ludoteca Quest</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b2616;
            color: #fff;
            font-family: 'MedievalSharp', cursive, sans-serif;
            touch-action: none;
            position: fixed;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
        }

        /* UI Top Bar */
        #top-bar {
            position: absolute;
            top: env(safe-area-inset-top, 12px);
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 100;
        }

        .ui-ribbon {
            background: linear-gradient(180deg, rgba(139, 90, 43, 0.92) 0%, rgba(74, 40, 16, 0.92) 100%);
            border: 2px solid #dfa143;
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #ffe6a3;
            text-shadow: 2px 2px 4px #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .char-select-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .char-select-btn:hover, .char-select-btn:active {
            background: linear-gradient(180deg, #a86c35 0%, #613515 100%);
            transform: scale(1.04);
            color: #fff;
        }

        /* --- VIRTUAL TOUCH CONTROLS (OPTIMIZED SAFE AREA) --- */
        #touch-controls {
            display: none;
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 15px) + 20px);
            left: 15px;
            right: 15px;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 100;
        }

        @media (max-width: 1024px), (hover: none) and (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }

        .dpad-container {
            position: relative;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }

        .dpad-btn {
            position: absolute;
            width: 44px;
            height: 44px;
            background: rgba(45, 25, 10, 0.82);
            border: 2px solid #dfa143;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        .dpad-btn:active {
            background: rgba(168, 108, 53, 0.95);
            transform: scale(0.92);
        }
        .dpad-up    { top: 0; left: 48px; }
        .dpad-down  { bottom: 0; left: 48px; }
        .dpad-left  { top: 48px; left: 0; }
        .dpad-right { top: 48px; right: 0; }

        .action-btn-container {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .touch-action-btn {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, rgba(168, 108, 53, 0.92) 0%, rgba(74, 40, 16, 0.92) 100%);
            border: 3px solid #ffd700;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
            box-shadow: 0 6px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(255, 215, 0, 0.5);
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        .touch-action-btn:active {
            transform: scale(0.9);
            background: linear-gradient(135deg, #ffd700 0%, #a86c35 100%);
            color: #000;
        }

        /* Modal Styles (Mobile Responsive) */
        #game-modal, #char-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 5, 0.92);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            padding: 15px;
        }
        .modal-content {
            background: linear-gradient(135deg, #2c1b10 0%, #150c07 100%);
            border: 4px solid #dfa143;
            border-radius: 14px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            gap: 25px;
            box-shadow: 0 0 45px rgba(223, 161, 67, 0.4), inset 0 0 25px rgba(0,0,0,0.8);
            position: relative;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                align-items: center;
                padding: 20px 15px;
                gap: 15px;
            }
            #modal-img {
                width: 100% !important;
                max-width: 220px !important;
                height: 260px !important;
            }
            .modal-details h2 {
                font-size: 18px !important;
                text-align: center;
            }
            .modal-details p {
                font-size: 13px !important;
            }
            .char-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            color: #dfa143;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px;
            z-index: 10;
        }
        .close-btn:hover, .close-btn:active {
            color: #fff;
            transform: scale(1.15);
        }
        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }
        .modal-details h2 {
            color: #ffd276;
            font-family: 'Cinzel', serif;
            text-shadow: 2px 2px 6px #000;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #5c3a21;
            padding-bottom: 8px;
        }
        .modal-details p {
            line-height: 1.6;
            font-size: 15px;
            color: #f1dfc5;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            border: 2px solid #dfa143;
            border-radius: 6px;
            background: linear-gradient(180deg, #7c4c23 0%, #3e200c 100%);
            color: #ffe6a3;
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-shadow: 1px 1px 2px #000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-action:hover, .btn-action:active {
            background: linear-gradient(180deg, #9d612e 0%, #542b10 100%);
            color: #fff;
        }

        /* Character Selection Grid */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        .char-card {
            background: rgba(40, 20, 10, 0.8);
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .char-card:hover, .char-card:active, .char-card.selected {
            border-color: #ffd700;
            background: rgba(90, 45, 20, 0.9);
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.3);
        }
        .char-card img {
            width: 50px;
            height: 50px;
            object-fit: none;
            object-position: 0 0;
            image-rendering: pixelated;
        }
        .char-card span {
            margin-top: 6px;
            font-size: 10px;
            color: #ffe6a3;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

            { id: 'warrior_red', name: 'Caballero Rojo', path: 'assets/tiny-swords/Factions/Knights/Troops/Warrior/Red/Warrior_Red.png', frameSize: 192 },
            { id: 'warrior_purple', name: 'Paladín Púrpura', path: 'assets/tiny-swords/Factions/Knights/Troops/Warrior/Purple/Warrior_Purple.png', frameSize: 192 },
            { id: 'warrior_yellow', name: 'Guerrero Dorado', path: 'assets/tiny-swords/Factions/Knights/Troops/Warrior/Yellow/Warrior_Yellow.png', frameSize: 192 },
            { id: 'archer_blue', name: 'Arquero Azul', path: 'assets/tiny-swords/Factions/Knights/Troops/Archer/Blue/Archer_Blue.png', frameSize: 192 },
            { id: 'archer_red', name: 'Arquero Rojo', path: 'assets/tiny-swords/Factions/Knights/Troops/Archer/Red/Archer_Red.png', frameSize: 192 },
            { id: 'pawn_blue', name: 'Explorador Azul', path: 'assets/tiny-swords/Factions/Knights/Troops/Pawn/Blue/Pawn_Blue.png', frameSize: 192 },
            { id: 'pawn_purple', name: 'Explorador Místico', path: 'assets/tiny-swords/Factions/Knights/Troops/Pawn/Purple/Pawn_Purple.png', frameSize: 192 }
        ];

        let selectedHero = HERO_CLASSES[0];

        // --- ASSET PRELOADER ---
        const assets = {
            heroes: {},
            tilemap: new Image(),
            water: new Image(),
            bridge: new Image(),
            tree: new Image(),
            houses: []
        };

        HERO_CLASSES.forEach(h => {
            const img = new Image();
            img.src = h.path;
            assets.heroes[h.id] = img;
        });

        assets.tilemap.src = 'assets/tiny-swords/Terrain/Ground/Tilemap_Flat.png';
        assets.water.src = 'assets/tiny-swords/Terrain/Water/Water.png';
        assets.bridge.src = 'assets/tiny-swords/Terrain/Bridge/Bridge_All.png';
        assets.tree.src = 'assets/tiny-swords/Resources/Trees/Tree.png';

        const HOUSE_SPRITE_PATHS = [
            'assets/tiny-swords/Factions/Knights/Buildings/House/House_Blue.png',
            'assets/tiny-swords/Factions/Knights/Buildings/House/House_Red.png',
            'assets/tiny-swords/Factions/Knights/Buildings/House/House_Yellow.png',
            'assets/tiny-swords/Factions/Knights/Buildings/House/House_Purple.png',
            'assets/tiny-swords/BuildingsCustom/Tavern.png',
            'assets/tiny-swords/BuildingsCustom/Library.png',
            'assets/tiny-swords/BuildingsCustom/Forge.png',
            'assets/tiny-swords/BuildingsCustom/Chapel.png',
            'assets/tiny-swords/BuildingsCustom/Alchemist.png',
            'assets/tiny-swords/Factions/Knights/Buildings/Tower/Tower_Blue.png',
            'assets/tiny-swords/Factions/Knights/Buildings/Tower/Tower_Yellow.png',
            'assets/tiny-swords/Factions/Knights/Buildings/Castle/Castle_Blue.png'
        ];

        HOUSE_SPRITE_PATHS.forEach(p => {
            const img = new Image();
            img.src = p;
            assets.houses.push(img);
        });

        // --- Character Modal UI ---
        function openCharModal() {
            const container = document.getElementById('char-grid-container');
            container.innerHTML = '';
            HERO_CLASSES.forEach(h => {
                const card = document.createElement('div');
                card.className = 'char-card ' + (selectedHero.id === h.id ? 'selected' : '');
                card.innerHTML = `
                    <div style="width:44px; height:44px; overflow:hidden; display:flex; justify-content:center; align-items:center;">
                        <img src="${h.path}" style="transform: scale(0.6) translate(-72px, -72px); transform-origin: 0 0;">
                    </div>
                    <span>${h.name}</span>
                `;
                card.onclick = () => {
                    selectedHero = h;
                    document.getElementById('current-hero-name').innerText = h.name;
                    closeCharModal();
                };
                container.appendChild(card);
            });
            document.getElementById('char-modal').style.display = 'flex';
        }

        function closeCharModal() {
            document.getElementById('char-modal').style.display = 'none';
        }

        // --- Game Modal Logic ---
        let activeGameForUpload = null;
        let isModalOpen = false;

        function openGameModal(game) {
            activeGameForUpload = game;
            isModalOpen = true;
            document.getElementById('modal-title').innerText = '🏠 ' + game.name;
            document.getElementById('modal-img').src = game.image + '?v=' + new Date().getTime();
            document.getElementById('modal-desc').innerHTML = `
                <span style="color:#ffd276; font-size:1.1em; font-weight:bold;">⭐ BGG: ${game.rating || 'N/A'}/10</span><br><br>
                <span style="color:#dfa143; font-weight:bold;">JUGADORES:</span> ${game.players}<br>
                <span style="color:#dfa143; font-weight:bold;">DIFICULTAD:</span> ${game.difficulty}<br>
                <span style="color:#dfa143; font-weight:bold;">CATEGORÍA:</span> ${game.type}
            `;
            const searchUrl = 'https://www.youtube.com/results?search_query=como+jugar+' + encodeURIComponent(game.name + ' juego de mesa tutorial');
            document.getElementById('modal-link').href = searchUrl;
            
            const bggUrl = 'https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=' + encodeURIComponent(game.name);
            document.getElementById('modal-bgg-link').href = bggUrl;
            
            document.getElementById('game-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('game-modal').style.display = 'none';
            setTimeout(() => { isModalOpen = false; }, 100);
        }

        async function uploadCover(event) {
            if (!activeGameForUpload) return;
            const file = event.target.files[0];
            if (!file) return;

            const filename = activeGameForUpload.image.split('/').pop().split('?')[0];

            try {
                const res = await fetch('http://127.0.0.1:7560/upload?filename=' + encodeURIComponent(filename), {
                    method: 'POST',
                    body: file
                });
                
                if(res.ok) {
                    document.getElementById('modal-img').src = activeGameForUpload.image + '?v=' + new Date().getTime();
                } else {
                    alert('Error subiendo imagen');
                }
            } catch (e) {
                alert('Error de conexión al servidor local.');
            }
        }

        // --- WORLD GENERATION ---
        const WORLD_COLS = 54;
        const WORLD_ROWS = 40;
        const TILE_SIZE = 54;

        const WATER = 0;
        const GRASS = 1;
        const PATH = 2;
        const BRIDGE_H = 3;
        const BRIDGE_V = 4;

        let worldMap = [];
        for (let r = 0; r < WORLD_ROWS; r++) {
            let row = [];
            for (let c = 0; c < WORLD_COLS; c++) {
                row.push(WATER);
            }
            worldMap.push(row);
        }

        const islands = [
            { name: "Distrito Norte-Oeste", c1: 3, c2: 24, r1: 3, r2: 17 },
            { name: "Distrito Norte-Este", c1: 29, c2: 50, r1: 3, r2: 17 },
            { name: "Distrito Sur-Oeste",  c1: 3, c2: 24, r1: 22, r2: 36 },
            { name: "Distrito Sur-Este",   c1: 29, c2: 50, r1: 22, r2: 36 }
        ];

        islands.forEach(isl => {
            for (let r = isl.r1; r <= isl.r2; r++) {
                for (let c = isl.c1; c <= isl.c2; c++) {
                    worldMap[r][c] = GRASS;
                }
            }
            const midR1 = isl.r1 + 4;
            const midR2 = isl.r1 + 9;
            const midC = Math.floor((isl.c1 + isl.c2) / 2);
            for (let c = isl.c1; c <= isl.c2; c++) {
                worldMap[midR1][c] = PATH;
                worldMap[midR2][c] = PATH;
            }
            for (let r = isl.r1; r <= isl.r2; r++) {
                worldMap[r][midC] = PATH;
            }
        });

        // Multiple direct horizontal bridges
        for (let c = 24; c <= 29; c++) {
            worldMap[7][c] = BRIDGE_H;
            worldMap[12][c] = BRIDGE_H;
            worldMap[26][c] = BRIDGE_H;
            worldMap[31][c] = BRIDGE_H;
        }

        // Multiple direct vertical bridges
        for (let r = 17; r <= 22; r++) {
            worldMap[r][8] = BRIDGE_V;
            worldMap[r][14] = BRIDGE_V;
            worldMap[r][20] = BRIDGE_V;
            worldMap[r][34] = BRIDGE_V;
            worldMap[r][40] = BRIDGE_V;
            worldMap[r][46] = BRIDGE_V;
        }

        // Houses for all games
        const houses = [];
        let gIndex = 0;

        islands.forEach((isl) => {
            const spots = [
                { c: isl.c1 + 1, r: isl.r1 + 1 },
                { c: isl.c1 + 6, r: isl.r1 + 1 },
                { c: isl.c1 + 11, r: isl.r1 + 1 },
                { c: isl.c1 + 16, r: isl.r1 + 1 },
                { c: isl.c1 + 1, r: isl.r1 + 6 },
                { c: isl.c1 + 6, r: isl.r1 + 6 },
                { c: isl.c1 + 11, r: isl.r1 + 6 },
                { c: isl.c1 + 16, r: isl.r1 + 6 },
                { c: isl.c1 + 1, r: isl.r1 + 11 },
                { c: isl.c1 + 6, r: isl.r1 + 11 },
                { c: isl.c1 + 11, r: isl.r1 + 11 },
                { c: isl.c1 + 16, r: isl.r1 + 11 }
            ];

            spots.forEach(spot => {
                if (gIndex < gamesData.length) {
                    const sIdx = gIndex % assets.houses.length;
                    houses.push({
                        gameIndex: gIndex,
                        c: spot.c,
                        r: spot.r,
                        spriteIndex: sIdx
                    });
                    for (let dr = 0; dr < 3; dr++) {
                        for (let dc = 0; dc < 3; dc++) {
                            if (spot.r + dr < WORLD_ROWS && spot.c + dc < WORLD_COLS) {
                                worldMap[spot.r + dr][spot.c + dc] = 10 + gIndex;
                            }
                        }
                    }
                    gIndex++;
                }
            });
        });

        // --- FULLSCREEN CANVAS & RESPONSIVE CAMERA ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: 14 * TILE_SIZE,
            y: 7 * TILE_SIZE,
            targetX: 14 * TILE_SIZE,
            targetY: 7 * TILE_SIZE,
            gridX: 14,
            gridY: 7,
            dirX: 0,
            dirY: 1,
            frame: 0,
            isMoving: false
        };

        const camera = {
            x: player.x,
            y: player.y
        };

        function movePlayer(dx, dy) {
            if (isModalOpen || document.getElementById('char-modal').style.display === 'flex') return;

            player.dirX = dx;
            player.dirY = dy;
            const nc = player.gridX + dx;
            const nr = player.gridY + dy;

            if (nc >= 0 && nc < WORLD_COLS && nr >= 0 && nr < WORLD_ROWS) {
                const nextTile = worldMap[nr][nc];
                if (nextTile === GRASS || nextTile === PATH || nextTile === BRIDGE_H || nextTile === BRIDGE_V) {
                    player.gridX = nc;
                    player.gridY = nr;
                    player.targetX = nc * TILE_SIZE;
                    player.targetY = nr * TILE_SIZE;
                }
            }
        }

        function interactAction() {
            if (isModalOpen) {
                closeModal();
                return;
            }
            const fc = player.gridX + player.dirX;
            const fr = player.gridY + player.dirY;
            if (fr >= 0 && fr < WORLD_ROWS && fc >= 0 && fc < WORLD_COLS) {
                const targetTile = worldMap[fr][fc];
                if (targetTile >= 10) {
                    const gIdx = targetTile - 10;
                    if (gamesData[gIdx]) {
                        openGameModal(gamesData[gIdx]);
                    }
                }
            }
        }

        function update() {
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                player.x += dx * 0.32;
                player.y += dy * 0.32;
                player.isMoving = true;
                player.frame += 0.2;
            } else {
                player.x = player.targetX;
                player.y = player.targetY;
                player.isMoving = false;
                player.frame += 0.08;
            }

            // Center camera around player on any screen resolution
            camera.x += (player.x + TILE_SIZE/2 - canvas.width/2 - camera.x) * 0.14;
            camera.y += (player.y + TILE_SIZE/2 - canvas.height/2 - camera.y) * 0.14;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

            const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE) - 2);
            const endCol = Math.min(WORLD_COLS - 1, Math.ceil((camera.x + canvas.width) / TILE_SIZE) + 2);
            const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE) - 2);
            const endRow = Math.min(WORLD_ROWS - 1, Math.ceil((camera.y + canvas.height) / TILE_SIZE) + 2);

            // 1. Draw Terrain Base
            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;
                    const tile = worldMap[r][c];

                    // Water under rivers and bridges
                    if (tile === WATER || tile === BRIDGE_H || tile === BRIDGE_V) {
                        if (assets.water.complete && assets.water.naturalWidth > 0) {
                            ctx.drawImage(assets.water, 0, 0, 64, 64, x, y, TILE_SIZE, TILE_SIZE);
                        } else {
                            ctx.fillStyle = '#2980b9';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }

                    // Grass
                    if (tile === GRASS || tile === PATH || tile >= 10) {
                        if (assets.tilemap.complete && assets.tilemap.naturalWidth > 0) {
                            ctx.drawImage(assets.tilemap, 64, 64, 64, 64, x, y, TILE_SIZE, TILE_SIZE);
                        } else {
                            ctx.fillStyle = '#4c7b2c';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }

                    // Paths
                    if (tile === PATH) {
                        if (assets.tilemap.complete && assets.tilemap.naturalWidth > 0) {
                            ctx.drawImage(assets.tilemap, 192, 64, 64, 64, x, y, TILE_SIZE, TILE_SIZE);
                        } else {
                            ctx.fillStyle = '#b8945a';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }

                    // Wood Bridges
                    if (tile === BRIDGE_H) {
                        if (assets.bridge.complete && assets.bridge.naturalWidth > 0) {
                            ctx.drawImage(assets.bridge, 64, 0, 64, 64, x, y - 4, TILE_SIZE, TILE_SIZE + 8);
                        } else {
                            ctx.fillStyle = '#8b5a2b';
                            ctx.fillRect(x, y + 8, TILE_SIZE, TILE_SIZE - 16);
                        }
                    } else if (tile === BRIDGE_V) {
                        if (assets.bridge.complete && assets.bridge.naturalWidth > 0) {
                            ctx.drawImage(assets.bridge, 0, 64, 64, 64, x - 4, y, TILE_SIZE + 8, TILE_SIZE);
                        } else {
                            ctx.fillStyle = '#8b5a2b';
                            ctx.fillRect(x + 8, y, TILE_SIZE - 16, TILE_SIZE);
                        }
                    }
                }
            }

            // 2. Draw House Buildings
            houses.forEach(h => {
                const hx = h.c * TILE_SIZE;
                const hy = h.r * TILE_SIZE;
                const sImg = assets.houses[h.spriteIndex];

                if (sImg && sImg.complete && sImg.naturalWidth > 0) {
                    ctx.drawImage(sImg, hx - 4, hy - 20, TILE_SIZE * 3 + 8, TILE_SIZE * 3 + 20);
                } else {
                    ctx.fillStyle = '#6b3e1b';
                    ctx.fillRect(hx, hy, TILE_SIZE * 3, TILE_SIZE * 3);
                }

                const game = gamesData[h.gameIndex];
                if (game) {
                    const pw = TILE_SIZE * 3 - 8;
                    const ph = 24;
                    const px = hx + 4;
                    const py = hy + TILE_SIZE * 2.7;

                    ctx.fillStyle = 'rgba(28, 14, 6, 0.95)';
                    ctx.fillRect(px, py, pw, ph);
                    ctx.strokeStyle = '#dfa143';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(px, py, pw, ph);

                    ctx.fillStyle = '#ffe6a3';
                    ctx.font = 'bold 12px "MedievalSharp", cursive';
                    ctx.textAlign = 'center';
                    const shortTitle = game.name.length > 18 ? game.name.substring(0, 16) + '..' : game.name;
                    ctx.fillText(shortTitle, hx + (TILE_SIZE * 3) / 2, py + 16);
                }
            });

            // 3. Highlight Target House
            const frontC = player.gridX + player.dirX;
            const frontR = player.gridY + player.dirY;
            if (frontR >= 0 && frontR < WORLD_ROWS && frontC >= 0 && frontC < WORLD_COLS) {
                const tTile = worldMap[frontR][frontC];
                if (tTile >= 10) {
                    const gIdx = tTile - 10;
                    const game = gamesData[gIdx];
                    if (game) {
                        const fx = frontC * TILE_SIZE;
                        const fy = frontR * TILE_SIZE;

                        const tw = 250;
                        const th = 54;
                        const bx = fx - tw/2 + TILE_SIZE/2;
                        const by = fy - 72;

                        ctx.fillStyle = 'rgba(20, 10, 5, 0.96)';
                        ctx.fillRect(bx, by, tw, th);
                        ctx.strokeStyle = '#ffd700';
                        ctx.lineWidth = 2.5;
                        ctx.strokeRect(bx, by, tw, th);

                        ctx.fillStyle = '#ffd700';
                        ctx.font = 'bold 13px "Cinzel", serif';
                        ctx.textAlign = 'left';
                        const titleTxt = game.name.length > 17 ? game.name.substring(0, 16) + '..' : game.name;
                        ctx.fillText('🏰 ' + titleTxt, bx + 12, by + 20);

                        ctx.fillStyle = '#78de78';
                        ctx.font = '10px "Press Start 2P", monospace';
                        ctx.fillText('▶ [ENTRAR]', bx + 12, by + 40);
                    }
                }
            }

            // 4. Draw Selected Hero
            const heroImg = assets.heroes[selectedHero.id];
            if (heroImg && heroImg.complete && heroImg.naturalWidth > 0) {
                const animRow = player.isMoving ? 1 : 0;
                const animFrame = Math.floor(player.frame) % 6;
                const sx = animFrame * selectedHero.frameSize;
                const sy = animRow * selectedHero.frameSize;

                ctx.save();
                if (player.dirX === -1) {
                    ctx.translate(player.x + TILE_SIZE/2, player.y + TILE_SIZE/2);
                    ctx.scale(-1, 1);
                    ctx.drawImage(heroImg, sx, sy, 192, 192, -54, -64, 108, 108);
                } else {
                    ctx.drawImage(heroImg, sx, sy, 192, 192, player.x - 27, player.y - 37, 108, 108);
                }
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // --- KEYBOARD CONTROLS (PC) ---
        window.addEventListener('keydown', (e) => {
            if (isModalOpen || document.getElementById('char-modal').style.display === 'flex') {
                if (e.key === 'Escape') {
                    closeModal();
                    closeCharModal();
                }
                return;
            }

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
            else if (e.key === 'Enter') interactAction();
        });

        // --- TOUCH CONTROLS (SMARTPHONE / TABLET) ---
        function attachTouchBtn(id, action) {
            const el = document.getElementById(id);
            if (!el) return;
            let interval = null;
            
            const start = (e) => {
                e.preventDefault();
                e.stopPropagation();
                action();
                interval = setInterval(action, 130);
            };
            const stop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (interval) clearInterval(interval);
            };

            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', stop, { passive: false });
            el.addEventListener('touchcancel', stop, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', stop);
            el.addEventListener('mouseleave', stop);
        }

        attachTouchBtn('btn-up', () => movePlayer(0, -1));
        attachTouchBtn('btn-down', () => movePlayer(0, 1));
        attachTouchBtn('btn-left', () => movePlayer(-1, 0));
        attachTouchBtn('btn-right', () => movePlayer(1, 0));

        const actBtn = document.getElementById('btn-action');
        actBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            interactAction();
        }, { passive: false });
        actBtn.addEventListener('click', interactAction);

        // Touch anywhere on Canvas to interact or walk directly
        canvas.addEventListener('click', (e) => {
            if (isModalOpen) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX + camera.x;
            const clickY = e.clientY + camera.y;

            const clickedCol = Math.floor(clickX / TILE_SIZE);
            const clickedRow = Math.floor(clickY / TILE_SIZE);

            if (clickedRow >= 0 && clickedRow < WORLD_ROWS && clickedCol >= 0 && clickedCol < WORLD_COLS) {
                const tile = worldMap[clickedRow][clickedCol];
                if (tile >= 10) {
                    const gIdx = tile - 10;
                    if (gamesData[gIdx]) {
                        openGameModal(gamesData[gIdx]);
                    }
                }
            }
        });
    </script>
</body>
</html>
