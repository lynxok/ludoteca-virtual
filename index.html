<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Ludoteca - RPG Engine</title>
    <!-- Favicon retro para eliminar el error 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px var(--neon-blue);
            border: 4px solid var(--neon-pink);
        }

        canvas {
            display: block;
            image-rendering: pixelated; /* Retro look */
        }

        /* Scanline Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Neon Variables */
        :root {
            --neon-blue: #0ff;
            --neon-pink: #f0f;
            --neon-yellow: #ff0;
        }

        /* Modal Styles from previous version */
        #game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #111;
            border: 3px solid var(--neon-pink);
            padding: 30px;
            max-width: 1000px;
            display: flex;
            gap: 30px;
            box-shadow: 0 0 30px var(--neon-pink);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--neon-pink);
            font-size: 1.5em;
            cursor: pointer;
        }
        .close-btn:hover { color: #fff; }
        .modal-details h2 {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-top: 0;
            font-size: 1.5em;
        }
        .modal-details p { line-height: 1.8; }
        .btn-action {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            text-decoration: none;
            text-shadow: 0 0 5px var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink) inset;
            transition: 0.2s;
            font-size: 0.8em;
        }
        .btn-action:hover {
            background: var(--neon-pink);
            color: #000;
        }
        
        #controls-help {
            margin-top: 20px;
            color: var(--neon-blue);
            font-size: 0.8em;
            text-shadow: 0 0 5px var(--neon-blue);
        }
    </style>
</head>
<body>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="scanlines"></div>
    </div>
    <div id="controls-help">WASD / FLECHAS: Moverse | ENTER: Abrir Estante</div>

    <!-- Modal -->
    <div id="game-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">X</span>
            <img id="modal-img" src="" alt="Cover" style="width: 350px; height: auto; max-height: 500px; object-fit: contain; border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);">
            <div class="modal-details">
                <h2 id="modal-title">TITLE</h2>
                <p id="modal-desc">Details</p>
                <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;">
                    <a href="#" id="modal-link" target="_blank" class="btn-action" style="margin-top:0;">▶ TUTORIAL VHS</a>
                    <a href="#" id="modal-bgg-link" target="_blank" class="btn-action" style="margin-top:0; border-color:var(--neon-blue); color:var(--neon-blue);">▶ VER EN BGG</a>
                    <label class="btn-action" style="cursor:pointer; margin-top:0; border-color: var(--neon-yellow); color: var(--neon-yellow);">
                        [ UPLOAD COVER ]
                        <input type="file" id="upload-input" style="display:none;" accept="image/*" onchange="uploadCover(event)">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gamesData = [{"name": "Secret Hitler", "players": "5-10", "difficulty": "Baja", "type": "Deducción social / Roles ocultos / Farol", "image": "portadas/Secret_Hitler.jpg", "rating": "7.7", "local_image": "portadas/Secret_Hitler.jpg"}, {"name": "Los Hombres Lobo de Castronegro", "players": "8-18", "difficulty": "Baja", "type": "Roles ocultos / Deducción social / Eliminación", "image": "portadas/Los_Hombres_Lobo_de_Castronegro.jpg", "rating": "7.1", "local_image": "portadas/Los_Hombres_Lobo_de_Castronegro.jpg"}, {"name": "Saboteur", "players": "3-10", "difficulty": "Baja", "type": "Roles ocultos / Farol / Construcción de caminos", "image": "portadas/Saboteur.jpg", "rating": "6.6", "local_image": "portadas/Saboteur.jpg"}, {"name": "Dany (Buró)", "players": "3-8", "difficulty": "Baja", "type": "Roles ocultos / Cartas / Asociación abstracta", "image": "portadas/Dany_Buró.jpg", "rating": "8.2", "local_image": "portadas/Dany_Buró.jpg"}, {"name": "Taco Gato Cabra Queso Pizza", "players": "2-8", "difficulty": "Baja", "type": "Reflejos / Velocidad de reacción / Cartas", "image": "portadas/Taco_Gato_Cabra_Queso_Pizza.jpg", "rating": "7.0", "local_image": "portadas/Taco_Gato_Cabra_Queso_Pizza.jpg"}, {"name": "Panic Lab (Maldón)", "players": "2-10", "difficulty": "Baja", "type": "Reflejos / Velocidad visual / Dados", "image": "portadas/Panic_Lab_Maldón.jpg", "rating": "7.2", "local_image": "portadas/Panic_Lab_Maldón.jpg"}, {"name": "Say My Name", "players": "4-12", "difficulty": "Baja", "type": "Party / Adivinanzas / Mímica", "image": "portadas/Say_My_Name.jpg", "rating": "8.5", "local_image": "portadas/Say_My_Name.jpg"}, {"name": "Con Eso No Se Jode", "players": "3-10", "difficulty": "Baja", "type": "Party / Humor negro / Cartas", "image": "portadas/Con_Eso_No_Se_Jode.jpg", "rating": "7.9", "local_image": "portadas/Con_Eso_No_Se_Jode.jpg"}, {"name": "Munchkin", "players": "3-6", "difficulty": "Baja", "type": "Cartas / Farol / Mazmorreo humorístico", "image": "portadas/Munchkin.jpg", "rating": "8.1", "local_image": "portadas/Munchkin.jpg"}, {"name": "Toma 6 (6 nimmt!)", "players": "2-10", "difficulty": "Baja", "type": "Gestión de mano / Descarte simultáneo", "image": "portadas/Toma_6_6_nimmt.jpg", "rating": "7.9", "local_image": "portadas/Toma_6_6_nimmt.jpg"}, {"name": "Color Brain", "players": "2-20", "difficulty": "Baja", "type": "Trivia de colores / Party", "image": "portadas/Color_Brain.jpg", "rating": "8.2", "local_image": "portadas/Color_Brain.jpg"}, {"name": "Dixit Clásico", "players": "3-8", "difficulty": "Baja", "type": "Deducción / Creatividad / Asociación", "image": "portadas/Dixit_Clásico.jpg", "rating": "8.8", "local_image": "portadas/Dixit_Clásico.jpg"}, {"name": "Dixit Odyssey", "players": "3-12", "difficulty": "Baja", "type": "Deducción / Creatividad / Modos por equipos", "image": "portadas/Dixit_Odyssey.jpg", "rating": "7.6", "local_image": "portadas/Dixit_Odyssey.jpg"}, {"name": "Just One", "players": "3-7", "difficulty": "Baja", "type": "Cooperativo / Deducción de palabras", "image": "portadas/Just_One.jpg", "rating": "8.0", "local_image": "portadas/Just_One.jpg"}, {"name": "Sushi Go!", "players": "2-5", "difficulty": "Baja", "type": "Card drafting / Colección de sets", "image": "portadas/Sushi_Go.jpg", "rating": "8.3", "local_image": "portadas/Sushi_Go.jpg"}, {"name": "Monopoly", "players": "2-6", "difficulty": "Media", "type": "Negociación / Gestión económica / Dados", "image": "portadas/Monopoly.jpg", "rating": "7.5", "local_image": "portadas/Monopoly.jpg"}, {"name": "Burako", "players": "2-4", "difficulty": "Media", "type": "Combinaciones / Gestión de fichas (Rummy)", "image": "portadas/Burako.jpg", "rating": "7.7", "local_image": "portadas/Burako.jpg"}, {"name": "La Isla Prohibida", "players": "2-4", "difficulty": "Media", "type": "Cooperativo / Gestión de acciones / Escape", "image": "portadas/La_Isla_Prohibida.jpg", "rating": "7.6", "local_image": "portadas/La_Isla_Prohibida.jpg"}, {"name": "¡Aventure s / Colocación de trabajadores", "image": "portadas/The_White_Castle.jpg", "rating": "8.8", "local_image": "portadas/The_White_Castle.jpg"}, {"name": "The Red Cathedral", "players": "1-4", "difficulty": "Alta", "type": "Rondel / Control de área / Optimización", "image": "portadas/The_Red_Cathedral.jpg", "rating": "8.8", "local_image": "portadas/The_Red_Cathedral.jpg"}, {"name": "Wingspan", "players": "1-5", "difficulty": "Alta", "type": "Engine building / Gestión de cartas y recursos", "image": "portadas/Wingspan.jpg", "rating": "8.4", "local_image": "portadas/Wingspan.jpg"}, {"name": "Root", "players": "2-4", "difficulty": "Alta", "type": "Asimétrico / Control de áreas / Wargame", "image": "portadas/Root.jpg", "rating": "6.8", "local_image": "portadas/Root.jpg"}, {"name": "Catan ciudades y caballeros", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "7.1", "image": "portadas/Catan_ciudades_y_caballeros.jpg", "local_image": "portadas/Catan_ciudades_y_caballeros.jpg"}, {"name": "Catan Energias renovables", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "7.7", "image": "portadas/Catan_Energias_renovables.jpg", "local_image": "portadas/Catan_Energias_renovables.jpg"}, {"name": "Melomano", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.0", "image": "portadas/Melomano.jpg", "local_image": "portadas/Melomano.jpg"}, {"name": "Panic Lab", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "7.9", "image": "portadas/Panic_Lab.jpg", "local_image": "portadas/Panic_Lab.jpg"}, {"name": "Atenea", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.2", "image": "portadas/Atenea.jpg", "local_image": "portadas/Atenea.jpg"}, {"name": "Bleef", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.4", "image": "portadas/Bleef.jpg", "local_image": "portadas/Bleef.jpg"}, {"name": "Jardin japones", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "7.3", "image": "portadas/Jardin_japones.jpg", "local_image": "portadas/Jardin_japones.jpg"}, {"name": "Count up", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.5", "image": "portadas/Count_up.jpg", "local_image": "portadas/Count_up.jpg"}, {"name": "Equipazo", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.0", "image": "portadas/Equipazo.jpg", "local_image": "portadas/Equipazo.jpg"}, {"name": "Munchkin: Dragones molones", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "7.4", "image": "portadas/Munchkin_Dragones_molones.jpg", "local_image": "portadas/Munchkin_Dragones_molones.jpg"}, {"name": "Munchkin 3: Errores clericales", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "6.5", "image": "portadas/Munchkin_3_Errores_clericales.jpg", "local_image": "portadas/Munchkin_3_Errores_clericales.jpg"}, {"name": "Munchkin 7: Trampas a dos manos", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "6.4", "image": "portadas/Munchkin_7_Trampas_a_dos_manos.jpg", "local_image": "portadas/Munchkin_7_Trampas_a_dos_manos.jpg"}, {"name": "Camarero", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.3", "image": "portadas/Camarero.jpg", "local_image": "portadas/Camarero.jpg"}, {"name": "CACA", "players": "2-6", "difficulty": "Media", "type": "Expansión / Cartas", "rating": "8.0", "image": "portadas/CACA.jpg", "local_image": "portadas/CACA.jpg"}];
        
        // --- Modal Logic ---
        let activeGameForUpload = null;
        let isModalOpen = false;

        function openGameModal(game) {
            activeGameForUpload = game;
            isModalOpen = true;
            document.getElementById('modal-title').innerText = game.name;
            document.getElementById('modal-img').src = game.image + '?v=' + new Date().getTime();
            document.getElementById('modal-desc').innerHTML = `
                <span style="color:var(--neon-yellow); font-size:1.2em; text-shadow: 0 0 5px var(--neon-yellow);">⭐ BGG RATING: ${game.rating || 'N/A'}/10</span><br><br>
                <span style="color:var(--neon-blue)">PLAYERS:</span> ${game.players}<br>
                <span style="color:var(--neon-blue)">DIFF:</span> ${game.difficulty}<br>
                <span style="color:var(--neon-blue)">TYPE:</span> ${game.type}
            `;
            const searchUrl = 'https://www.youtube.com/results?search_query=como+jugar+' + encodeURIComponent(game.name + ' juego de mesa tutorial');
            document.getElementById('modal-link').href = searchUrl;
            
            const bggUrl = 'https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=' + encodeURIComponent(game.name);
            document.getElementById('modal-bgg-link').href = bggUrl;
            
            document.getElementById('game-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('game-modal').style.display = 'none';
            // Slight delay so they don't immediately interact again if they hit enter to close
            setTimeout(() => { isModalOpen = false; }, 100);
        }

        async function uploadCover(event) {
            if (!activeGameForUpload) return;
            const file = event.target.files[0];
            if (!file) return;

            const filename = activeGameForUpload.image.split('/').pop().split('?')[0];

            try {
                const res = await fetch('http://127.0.0.1:7560/upload?filename=' + encodeURIComponent(filename), {
                    method: 'POST',
                    body: file
                });
                
                if(res.ok) {
                    document.getElementById('modal-img').src = activeGameForUpload.image + '?v=' + new Date().getTime();
                } else {
                    alert('Error subiendo imagen');
                }
            } catch (e) {
                alert('Error de conexión al servidor local.');
            }
        }

        // --- RPG Engine Logic ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 40;
        const COLS = canvas.width / TILE_SIZE; // 20
        const ROWS = canvas.height / TILE_SIZE; // 15
        
        const FLOOR = 0;
        const WALL = 1;
        
        let map = [];
        for(let r=0; r<ROWS; r++) {
            let row = [];
            for(let c=0; c<COLS; c++) {
                if(r===0 || r===ROWS-1 || c===0 || c===COLS-1) row.push(WALL);
                else row.push(FLOOR);
            }
            map.push(row);
        }
        
        let gameIndex = 0;
        // Shelves at columns 3-4, 8-9, 13-14.
        const shelfCols = [3, 4,  8, 9,  13, 14]; 
        for(let r=2; r<ROWS-2; r++) {
            for(let c of shelfCols) {
                if (r % 4 === 0) continue; // Horizontal paths breaking up shelves
                if (gameIndex < gamesData.length) {
                    map[r][c] = 10 + gameIndex; // 10 offset to distinguish from walls
                    gameIndex++;
                } else {
                    map[r][c] = WALL; // Empty shelf
                }
            }
        }

        const player = {
            x: 10,
            y: 13,
            dirX: 0,
            dirY: -1,
            color: '#0f0'
        };

        function drawMap() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    let tile = map[r][c];
                    
                    if (tile === FLOOR) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                        ctx.strokeRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (tile === WALL) {
                        ctx.fillStyle = '#333';
                        ctx.fillRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.strokeStyle = '#f0f';
                        ctx.strokeRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    } else if (tile >= 10) {
                        ctx.fillStyle = '#114';
                        ctx.fillRect(c*TILE_SIZE, r*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        
                        ctx.strokeStyle = '#0ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(c*TILE_SIZE+2, r*TILE_SIZE+2, TILE_SIZE-4, TILE_SIZE-4);
                        
                        ctx.fillStyle = '#ff0';
                        ctx.fillRect(c*TILE_SIZE+10, r*TILE_SIZE+10, TILE_SIZE-20, TILE_SIZE-20);
                    }
                }
            }
        }

        function drawPlayer() {
            const px = player.x * TILE_SIZE;
            const py = player.y * TILE_SIZE;
            
            ctx.shadowBlur = 0; 
            
            const dirX = player.dirX;
            const dirY = player.dirY;

            // Make Sonic 16-bit and slightly larger than a tile
            const drawX = px; 
            const drawY = py - 12; // Taller offset

            // Sonic Blue Body & Head
            ctx.fillStyle = '#0026e6';
            ctx.fillRect(drawX + 8, drawY + 2, 24, 20); // Head
            ctx.fillRect(drawX + 12, drawY + 22, 16, 14); // Body

            // Spikes (16-bit style sharper triangles)
            if (dirX === 1) { 
                ctx.beginPath(); ctx.moveTo(drawX+8, drawY+2); ctx.lineTo(drawX-4, drawY+8); ctx.lineTo(drawX+8, drawY+14); ctx.fill();
                ctx.beginPath(); ctx.moveTo(drawX+8, drawY+10); ctx.lineTo(drawX-6, drawY+16); ctx.lineTo(drawX+8, drawY+22); ctx.fill();
                ctx.beginPath(); ctx.moveTo(drawX+10, drawY+18); ctx.lineTo(drawX-2, drawY+24); ctx.lineTo(drawX+10, drawY+28); ctx.fill();
            } else if (dirX === -1) { 
                ctx.beginPath(); ctx.moveTo(drawX+32, drawY+2); ctx.lineTo(drawX+44, drawY+8); ctx.lineTo(drawX+32, drawY+14); ctx.fill();
                ctx.beginPath(); ctx.moveTo(drawX+32, drawY+10); ctx.lineTo(drawX+46, drawY+16); ctx.lineTo(drawX+32, drawY+22); ctx.fill();
                ctx.beginPath(); ctx.moveTo(drawX+30, drawY+18); ctx.lineTo(drawX+42, drawY+24); ctx.lineTo(drawX+30, drawY+28); ctx.fill();
            }

            // Face / Belly
            ctx.fillStyle = '#ffcc99';
            if (dirY === 1 || dirX !== 0) { 
                ctx.fillRect(drawX + 12, drawY + 10, 16, 12); // Snout/Face
                ctx.beginPath(); ctx.arc(drawX+20, drawY+29, 6, 0, 2*Math.PI); ctx.fill(); // Belly
            }

            // Eyes 
            if (dirY === 1) { 
                ctx.fillStyle = '#fff';
                ctx.fillRect(drawX + 13, drawY + 10, 6, 8);
                ctx.fillRect(drawX + 21, drawY + 10, 6, 8);
                ctx.fillStyle = '#000';
                ctx.fillRect(drawX + 16, drawY + 13, 3, 4);
                ctx.fillRect(drawX + 21, drawY + 13, 3, 4);
            } else if (dirX === 1) { 
                ctx.fillStyle = '#fff'; ctx.fillRect(drawX + 18, drawY + 10, 10, 8);
                ctx.fillStyle = '#000'; ctx.fillRect(drawX + 24, drawY + 13, 4, 4);
            } else if (dirX === -1) { 
                ctx.fillStyle = '#fff'; ctx.fillRect(drawX + 12, drawY + 10, 10, 8);
                ctx.fillStyle = '#000'; ctx.fillRect(drawX + 12, drawY + 13, 4, 4);
            }

            // Shoes (Red & White)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(drawX + 4, drawY + 36, 14, 10); 
            ctx.fillRect(drawX + 22, drawY + 36, 14, 10); 
            ctx.fillStyle = '#fff';
            ctx.fillRect(drawX + 10, drawY + 36, 4, 10);
            ctx.fillRect(drawX + 28, drawY + 36, 4, 10);

            // Highlight interaction target
            const tx = player.x + player.dirX;
            const ty = player.y + player.dirY;
            if(tx >=0 && tx < COLS && ty >= 0 && ty < ROWS) {
                const targetTile = map[ty][tx];
                if (targetTile >= 10) {
                    ctx.strokeStyle = '#f0f';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tx*TILE_SIZE, ty*TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    
                    const gameIndex = targetTile - 10;
                    const game = gamesData[gameIndex];
                    if (game) {
                        const tooltipWidth = 180;
                        const tooltipHeight = 40;
                        const tooltipX = tx*TILE_SIZE - (tooltipWidth/2) + (TILE_SIZE/2);
                        const tooltipY = ty*TILE_SIZE - 50;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                        ctx.fillRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);
                        ctx.strokeStyle = '#0ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);
                        
                        ctx.fillStyle = '#ff0';
                        ctx.font = "9px 'Press Start 2P'";
                        const shortName = game.name.length > 15 ? game.name.substring(0, 14) + '..' : game.name;
                        ctx.fillText(shortName, tooltipX + 8, tooltipY + 15);
                        
                        ctx.fillStyle = '#f0f';
                        ctx.font = "8px 'Press Start 2P'";
                        ctx.fillText("[ENTER] Abrir", tooltipX + 8, tooltipY + 30);
                    }
                }
            }
        }

        function render() {
            drawMap();
            drawPlayer();
        }
        
        render();

        window.addEventListener('keydown', (e) => {
            if (isModalOpen) {
                if (e.key === 'Escape') closeModal();
                // We don't want enter to immediately re-trigger interaction, so modal close logic is separate
                return;
            }
            
            let moved = false;
            let nx = player.x;
            let ny = player.y;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                player.dirX = 0; player.dirY = -1; ny--; moved = true;
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                player.dirX = 0; player.dirY = 1; ny++; moved = true;
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                player.dirX = -1; player.dirY = 0; nx--; moved = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                player.dirX = 1; player.dirY = 0; nx++; moved = true;
            } else if (e.key === 'Enter') {
                const tx = player.x + player.dirX;
                const ty = player.y + player.dirY;
                if(map[ty] && map[ty][tx] >= 10) {
                    const gameIndex = map[ty][tx] - 10;
                    if(gamesData[gameIndex]) {
                        openGameModal(gamesData[gameIndex]);
                    }
                }
            }

            if (moved) {
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    if (map[ny][nx] === FLOOR) {
                        player.x = nx;
                        player.y = ny;
                    }
                }
                render();
            }
        });
    </script>
</body>
</html>
